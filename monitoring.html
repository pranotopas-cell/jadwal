<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LIVE MAP MOBILE - AUTO UPDATE</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; background: #1a1a1a; }
        #map { height: 100vh; width: 100%; z-index: 1; }
        
        .side-menu {
            position: absolute; top: 10px; left: 10px;
            z-index: 1000; display: flex; flex-direction: column; gap: 8px;
        }

        .right-menu-container {
            position: absolute; top: 10px; right: 10px;
            z-index: 1000; display: none; flex-direction: column; gap: 10px;
            width: 200px; max-width: 80vw;
        }

        .route-menu, .focus-menu, .distance-menu {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px); padding: 12px;
            border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
            color: white; display: flex; flex-direction: column; gap: 8px;
        }

        .route-menu select, .focus-menu select, .distance-menu select {
            background: #333; color: white; border: 1px solid #444;
            padding: 8px; border-radius: 6px; font-size: 14px; width: 100%;
            outline: none; -webkit-appearance: none;
        }

        .float-item {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: white; cursor: pointer; transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .nav-btn { width: 48px; height: 48px; font-size: 20px; text-decoration: none; }
        .btn-toggle-menu { background: #3498db; color: white; border: none; }
        .btn-home { background: #f39c12; color: white; border: none; }

        .btn-route {
            background: #2ecc71; color: white; border: none;
            padding: 10px; border-radius: 6px; font-size: 13px;
            font-weight: bold; cursor: pointer;
        }

        #dist-res {
            font-size: 14px; font-weight: bold; color: #f1c40f; text-align: center; margin-top: 4px;
            line-height: 1.4;
        }

        #poi-panel {
            position: absolute; top: 0; left: 60px;
            width: 260px; max-width: 70vw; background: white; border-radius: 12px;
            padding: 15px; display: none; max-height: 70vh; overflow-y: auto;
            box-shadow: 5px 5px 20px rgba(0,0,0,0.5); color: #333;
        }

        .poi-label {
            background: rgba(255, 255, 255, 0.9); border: 1px solid #333;
            border-radius: 4px; padding: 2px 6px; font-size: 10px;
            color: #000; font-weight: 700; white-space: nowrap;
        }

        .unit-popup .leaflet-popup-content-wrapper { background: rgba(0, 0, 0, 0.9); color: #fff; border: 1px solid #2ecc71; }
        .active-gps { background: #9b59b6 !important; border: 2px solid white; }
    </style>
</head>
<body>

    <div class="side-menu">
        <a href="index.html" class="float-item nav-btn btn-home"><i class="fa-solid fa-house"></i></a>
        <button class="float-item nav-btn" onclick="location.reload()"><i class="fa-solid fa-rotate"></i></button>
        <button class="float-item nav-btn" onclick="fitAllUnits()"><i class="fa-solid fa-expand"></i></button>
        <button class="float-item nav-btn" onclick="togglePOI()" id="poi-btn"><i class="fa-solid fa-map-location-dot"></i></button>
        <button class="float-item nav-btn" onclick="toggleWatchLocation()" id="gps-btn"><i class="fa-solid fa-crosshairs"></i></button>
        <button class="float-item nav-btn btn-toggle-menu" onclick="toggleRightMenu()"><i class="fa-solid fa-bars"></i></button>

        <div id="poi-panel">
            <button style="width:100%; background:#2ecc71; color:white; border:none; padding:12px; border-radius:8px; font-weight:bold; margin-bottom:10px;" onclick="startAddPOIMode()"><i class="fa-solid fa-plus"></i> Tambah Lokasi</button>
            <div id="poi-list"></div>
        </div>
    </div>

    <div class="right-menu-container" id="right-menu">
        <div class="route-menu">
            <div style="font-size: 11px; font-weight: bold; color: #2ecc71;"><i class="fa-solid fa-route"></i> NAVIGASI RUTE</div>
            <select id="select-dest">
                <option value="">Pilih Tujuan...</option>
            </select>
            <button class="btn-route" onclick="openNav()"><i class="fa-solid fa-location-arrow"></i> Mulai Jalan</button>
        </div>

        <div class="focus-menu">
            <div style="font-size: 11px; font-weight: bold; color: #3498db;"><i class="fa-solid fa-truck"></i> FOKUS UNIT</div>
            <select id="select-unit" onchange="focusUnit(this.value)">
                <option value="">Cari Unit...</option>
            </select>
        </div>

        <div class="distance-menu">
            <div style="font-size: 11px; font-weight: bold; color: #f1c40f;"><i class="fa-solid fa-ruler-combined"></i> ESTIMASI JARAK JALAN</div>
            <select id="select-dist-poi" onchange="manualSelectPOI(this.value)">
                <option value="">Pilih Lokasi POI...</option>
            </select>
            <div id="dist-res">Pilih Lokasi</div>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const SUPABASE_URL = 'https://ntaECTphgoelmhzrkatp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50YWVjdHBoZ29lbG1oenJrYXRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1NzExNDYsImV4cCI6MjA4ODE0NzE0Nn0.-8E98wpkzHBARRhW6PKhBtf2XKhWFjq7idAzw9jlcKg';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([-2.5489, 118.0149], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let markers = { units: {}, pois: {} };
        let routeLayer = null;
        let userMarker = null;
        let userCoords = null;
        let watchId = null;
        let currentSelectedPOI = null; // Menyimpan POI yang sedang dipantau

        function toggleRightMenu() {
            const menu = document.getElementById('right-menu');
            menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
        }

        function togglePOI() {
            const p = document.getElementById('poi-panel');
            p.style.display = p.style.display === 'block' ? 'none' : 'block';
        }

        // FUNGSI UTAMA: GPS HIDUP TERUS & UPDATE OTOMATIS
        function toggleWatchLocation() {
            const btn = document.getElementById('gps-btn');
            
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
                btn.classList.remove('active-gps');
                if (userMarker) map.removeLayer(userMarker);
                alert("GPS Dimatikan");
                return;
            }

            if (!navigator.geolocation) return alert("GPS tidak didukung");

            btn.classList.add('active-gps');
            watchId = navigator.geolocation.watchPosition((pos) => {
                const lat = pos.coords.latitude, lon = pos.coords.longitude;
                userCoords = [lat, lon];

                if (userMarker) {
                    userMarker.setLatLng(userCoords);
                } else {
                    userMarker = L.marker(userCoords, { 
                        icon: L.icon({ 
                            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-violet.png', 
                            iconSize: [25, 41], iconAnchor: [12, 41] 
                        }) 
                    }).addTo(map);
                    map.flyTo(userCoords, 15);
                }

                // JIKA POI SUDAH DIPILIH, UPDATE JARAK OTOMATIS SAAT JALAN
                if (currentSelectedPOI) {
                    calculateRoadDistance(currentSelectedPOI);
                }
            }, (err) => {
                alert("Gagal akses GPS. Pastikan Izin Lokasi Aktif.");
                btn.classList.remove('active-gps');
            }, { enableHighAccuracy: true });
        }

        function manualSelectPOI(coords) {
            currentSelectedPOI = coords;
            calculateRoadDistance(coords);
        }

        function formatDuration(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            if (h > 0) return `${h} Jam ${m} Menit`;
            return `${m} Menit`;
        }

        async function calculateRoadDistance(coords) {
            const resDiv = document.getElementById('dist-res');
            if (!coords) { resDiv.innerHTML = "Pilih Lokasi"; return; }
            
            if (!userCoords) {
                resDiv.innerHTML = "<span style='color:white'>Tunggu GPS...</span>";
                return;
            }

            const [poiLat, poiLon] = coords.split(',');
            const [userLat, userLon] = userCoords;

            try {
                const url = `https://router.project-osrm.org/route/v1/driving/${userLon},${userLat};${poiLon},${poiLat}?overview=full&geometries=geojson`;
                const response = await fetch(url);
                const result = await response.json();

                if (result.code === 'Ok') {
                    const data = result.routes[0];
                    const roadDistance = (data.distance / 1000).toFixed(1);
                    const roadDuration = formatDuration(data.duration);
                    
                    resDiv.innerHTML = `Jarak: ${roadDistance} KM<br><span style="color:#2ecc71"><i class="fa-regular fa-clock"></i> Waktu: ${roadDuration}</span>`;

                    if (routeLayer) map.removeLayer(routeLayer);
                    routeLayer = L.geoJSON(data.geometry, {
                        style: { color: '#3498db', weight: 5, opacity: 0.7 }
                    }).addTo(map);
                }
            } catch (err) {
                console.log("Error update rute");
            }
        }

        // --- Sisanya Fungsi Database (POIs & Units) ---

        async function fetchUnits() {
            const { data, error } = await _supabase.from('tracking_unit').select('*').eq('status', 'ON_JOB');
            if (error) return;
            const selectUnit = document.getElementById('select-unit');
            const currentVal = selectUnit.value;
            selectUnit.innerHTML = '<option value="">Cari Unit...</option>';
            data?.forEach(u => {
                const lat = parseFloat(u.lat), lon = parseFloat(u.lon);
                const opt = document.createElement('option');
                opt.value = `${lat},${lon}`;
                opt.textContent = `${u.nopol} - ${u.sopir}`;
                selectUnit.appendChild(opt);
                const popupContent = `<div style="line-height:1.6"><b style="color:#2ecc71">${u.nopol}</b><br><b>Sopir:</b> ${u.sopir}</div>`;
                if (markers.units[u.nopol]) {
                    markers.units[u.nopol].setLatLng([lat, lon]);
                } else {
                    markers.units[u.nopol] = L.marker([lat, lon], { icon: L.icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png', iconSize: [25, 41], iconAnchor: [12, 41] }) }).addTo(map).bindPopup(popupContent);
                }
            });
            selectUnit.value = currentVal;
        }

        async function loadPOIs() {
            const { data, error } = await _supabase.from('poi_lokasi').select('*');
            if (error) return;
            const list = document.getElementById('poi-list');
            const selectNav = document.getElementById('select-dest');
            const selectDist = document.getElementById('select-dist-poi');
            list.innerHTML = ""; 
            selectNav.innerHTML = '<option value="">Pilih Tujuan...</option>';
            selectDist.innerHTML = '<option value="">Pilih Lokasi POI...</option>';
            data?.forEach(p => {
                const div = document.createElement('div');
                div.style = "padding:12px; border-bottom:1px solid #eee; cursor:pointer;";
                div.innerHTML = `📍 ${p.nama}`;
                div.onclick = () => focusLoc(p.lat, p.lon);
                list.appendChild(div);
                
                const opt = document.createElement('option');
                opt.value = `${p.lat},${p.lon}`; opt.textContent = p.nama;
                selectNav.appendChild(opt.cloneNode(true));
                selectDist.appendChild(opt);
                
                if (!markers.pois[p.id]) {
                    markers.pois[p.id] = L.marker([p.lat, p.lon], { icon: L.icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-black.png', iconSize: [18, 28], iconAnchor: [9, 28] }) }).addTo(map).bindTooltip(p.nama, { className: 'poi-label', permanent: true, direction: 'top', offset: [0, -28] });
                }
            });
        }

        function focusUnit(coords) { if (coords) { const c = coords.split(','); map.flyTo([c[0], c[1]], 16); toggleRightMenu(); } }
        function focusLoc(lat, lon) { map.flyTo([lat, lon], 16); togglePOI(); }
        function fitAllUnits() { const all = Object.values(markers.units); if (all.length) map.fitBounds(L.featureGroup(all).getBounds(), {padding:[20,20]}); }
        function openNav() {
            const coords = document.getElementById('select-dest').value;
            if (!coords) return alert("Pilih tujuan!");
            window.open(`https://www.google.com/maps/dir/?api=1&destination=${coords}&travelmode=driving`, '_blank');
        }

        loadPOIs(); fetchUnits();
        setInterval(fetchUnits, 10000);
    </script>
</body>
</html>
