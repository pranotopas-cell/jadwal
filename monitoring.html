<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LIVE MAP MOBILE - ROTATE ENABLED</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    
    <!-- Script Leaflet & Supabase -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Plugin Rotasi - Pastikan menggunakan versi yang stabil -->
    <script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; overflow: hidden; background: #1a1a1a; }
        #map { height: 100vh; width: 100%; z-index: 1; }
        
        /* Menu Samping Kiri */
        .side-menu {
            position: absolute; top: 10px; left: 10px;
            z-index: 1000; display: flex; flex-direction: column; gap: 8px;
        }

        .right-menu-container {
            position: absolute; top: 10px; right: 10px;
            z-index: 1000; display: none; flex-direction: column; gap: 10px;
            width: 200px; max-width: 80vw;
        }

        .route-menu, .focus-menu, .distance-menu {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px); padding: 12px;
            border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
            color: white; display: flex; flex-direction: column; gap: 8px;
        }

        .route-menu select, .focus-menu select, .distance-menu select {
            background: #333; color: white; border: 1px solid #444;
            padding: 8px; border-radius: 6px; font-size: 14px; width: 100%;
        }

        .float-item {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: white; cursor: pointer; transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .nav-btn { width: 48px; height: 48px; font-size: 20px; }
        .btn-toggle-menu { background: #3498db; }
        .btn-home { background: #f39c12; }
        .btn-route { background: #2ecc71; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: bold; }

        #dist-res { font-size: 12px; color: #f1c40f; text-align: center; }

        #poi-panel {
            position: absolute; top: 0; left: 60px;
            width: 260px; max-width: 70vw; background: white; border-radius: 12px;
            padding: 15px; display: none; max-height: 70vh; overflow-y: auto;
            box-shadow: 5px 5px 20px rgba(0,0,0,0.5); color: #333;
        }

        .poi-label { background: white; border: 1px solid #333; border-radius: 4px; padding: 2px 6px; font-size: 10px; font-weight: bold; }

        .unit-popup .leaflet-popup-content-wrapper { background: rgba(0, 0, 0, 0.9); color: #fff; border: 1px solid #2ecc71; }
        
        /* Custom Zoom Center */
        .leaflet-top.leaflet-center { left: 50%; transform: translateX(-50%); top: 10px; }
        .leaflet-center .leaflet-control-zoom { display: flex; flex-direction: row; border: none; }
        .leaflet-center .leaflet-control-zoom-in, .leaflet-center .leaflet-control-zoom-out {
            background: rgba(0,0,0,0.8) !important; color: white !important; width: 40px !important; height: 40px !important; line-height: 40px !important; border-radius: 8px !important; margin: 0 5px !important;
        }
    </style>
</head>
<body>

    <div class="side-menu">
        <a href="index.html" class="float-item nav-btn btn-home"><i class="fa-solid fa-house"></i></a>
        <button class="float-item nav-btn" onclick="location.reload()"><i class="fa-solid fa-rotate"></i></button>
        <button class="float-item nav-btn" onclick="fitAllUnits()"><i class="fa-solid fa-expand"></i></button>
        <button class="float-item nav-btn" onclick="togglePOI()" id="poi-btn"><i class="fa-solid fa-map-location-dot"></i></button>
        <button class="float-item nav-btn" onclick="locateUser()"><i class="fa-solid fa-crosshairs"></i></button>
        <button class="float-item nav-btn btn-toggle-menu" onclick="toggleRightMenu()"><i class="fa-solid fa-bars"></i></button>

        <div id="poi-panel">
            <button style="width:100%; background:#2ecc71; color:white; border:none; padding:12px; border-radius:8px; font-weight:bold; margin-bottom:10px;" onclick="startAddPOIMode()"><i class="fa-solid fa-plus"></i> Tambah Lokasi</button>
            <div id="poi-list"></div>
        </div>
    </div>

    <div class="right-menu-container" id="right-menu">
        <div class="route-menu">
            <div style="font-size: 11px; font-weight: bold; color: #2ecc71;"><i class="fa-solid fa-route"></i> NAVIGASI</div>
            <select id="select-dest"><option value="">Pilih Tujuan...</option></select>
            <button class="btn-route" onclick="openNav()">Mulai Jalan</button>
        </div>
        <div class="focus-menu">
            <div style="font-size: 11px; font-weight: bold; color: #3498db;"><i class="fa-solid fa-truck"></i> UNIT</div>
            <select id="select-unit" onchange="focusUnit(this.value)"><option value="">Cari...</option></select>
        </div>
        <div class="distance-menu">
            <div style="font-size: 11px; font-weight: bold; color: #f1c40f;"><i class="fa-solid fa-ruler"></i> ESTIMASI</div>
            <select id="select-dist-poi" onchange="calculateRoadDistance(this.value)"><option value="">Pilih Lokasi...</option></select>
            <div id="dist-res">Jarak: -<br>Waktu: -</div>
        </div>
    </div>

    <div id="map"></div>

    <script>
        const SUPABASE_URL = 'https://ntaECTphgoelmhzrkatp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50YWVjdHBoZ29lbG1oenJrYXRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1NzExNDYsImV4cCI6MjA4ODE0NzE0Nn0.-8E98wpkzHBARRhW6PKhBtf2XKhWFjq7idAzw9jlcKg';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const savedLat = localStorage.getItem('map_lat') || -2.5489;
        const savedLon = localStorage.getItem('map_lon') || 118.0149;
        const savedZoom = localStorage.getItem('map_zoom') || 5;
        const savedBearing = localStorage.getItem('map_bearing') || 0;

        // INSIALISASI MAP DENGAN PLUGIN ROTATE
        const map = L.map('map', {
            zoomControl: false,
            attributionControl: false,
            rotate: true,
            bearing: savedBearing,
            touchRotate: true,
            rotateControl: {
                closeOnZeroBearing: false,
                position: 'bottomright'
            }
        }).setView([savedLat, savedLon], savedZoom);

        // Tambahkan Tile Layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // Custom Zoom Control di Tengah Atas
        const corners = map._controlCorners;
        corners.topcenter = L.DomUtil.create('div', 'leaflet-top leaflet-center', map._controlContainer);
        L.control.zoom({ position: 'topcenter' }).addTo(map);

        // Simpan posisi dan rotasi terakhir
        map.on('moveend zoomend rotateend', () => {
            const center = map.getCenter();
            localStorage.setItem('map_lat', center.lat);
            localStorage.setItem('map_lon', center.lng);
            localStorage.setItem('map_zoom', map.getZoom());
            localStorage.setItem('map_bearing', map.getBearing());
        });

        let markers = { units: {}, pois: {} };
        let routeLayer = null;
        let userMarker = null;
        let isAddMode = false;
        let userCoords = null;

        const poiIcons = {
            black: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-black.png',
            blue: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
            red: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            gold: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-gold.png'
        };

        function toggleRightMenu() {
            const menu = document.getElementById('right-menu');
            menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
        }

        function togglePOI() {
            const p = document.getElementById('poi-panel');
            p.style.display = p.style.display === 'block' ? 'none' : 'block';
        }

        function locateUser() {
            if (!navigator.geolocation) return alert("GPS tidak didukung");
            navigator.geolocation.getCurrentPosition((pos) => {
                const lat = pos.coords.latitude, lon = pos.coords.longitude;
                userCoords = [lat, lon];
                if (userMarker) userMarker.setLatLng(userCoords);
                else {
                    userMarker = L.marker(userCoords, { icon: L.icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-violet.png', iconSize: [25, 41], iconAnchor: [12, 41] }) }).addTo(map);
                }
                map.flyTo(userCoords, 15);
            }, () => alert("Aktifkan GPS HP Anda"));
        }

        async function fetchUnits() {
            const { data, error } = await _supabase.from('tracking_unit').select('*').eq('status', 'ON_JOB');
            if (error) return;
            const selectUnit = document.getElementById('select-unit');
            const currentVal = selectUnit.value;
            selectUnit.innerHTML = '<option value="">Cari Unit...</option>';
            data?.forEach(u => {
                const lat = parseFloat(u.lat), lon = parseFloat(u.lon);
                const opt = document.createElement('option');
                opt.value = `${lat},${lon}`;
                opt.textContent = `${u.nopol} - ${u.sopir}`;
                selectUnit.appendChild(opt);
                const popupContent = `<div style="line-height:1.6"><b style="color:#2ecc71">${u.nopol}</b><br><b>Sopir:</b> ${u.sopir}</div>`;
                if (markers.units[u.nopol]) {
                    markers.units[u.nopol].setLatLng([lat, lon]);
                    markers.units[u.nopol].getPopup().setContent(popupContent);
                } else {
                    markers.units[u.nopol] = L.marker([lat, lon], { icon: L.icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png', iconSize: [25, 41], iconAnchor: [12, 41] }) }).addTo(map).bindPopup(popupContent, { className: 'unit-popup', offset: [0, -30] });
                }
            });
            selectUnit.value = currentVal;
        }

        async function loadPOIs() {
            const { data, error } = await _supabase.from('poi_lokasi').select('*');
            if (error) return;
            const list = document.getElementById('poi-list');
            const selectNav = document.getElementById('select-dest');
            const selectDist = document.getElementById('select-dist-poi');
            list.innerHTML = ""; selectNav.innerHTML = '<option value="">Pilih Tujuan...</option>'; selectDist.innerHTML = '<option value="">Pilih Lokasi...</option>';
            data?.forEach(p => {
                const div = document.createElement('div');
                div.style = "padding:12px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; cursor:pointer;";
                div.innerHTML = `<span onclick="focusLoc(${p.lat}, ${p.lon})" style="flex:1; font-weight:500;">📍 ${p.nama}</span>`;
                list.appendChild(div);
                const opt = document.createElement('option');
                opt.value = `${p.lat},${p.lon}`; opt.textContent = p.nama;
                selectNav.appendChild(opt.cloneNode(true)); selectDist.appendChild(opt);
                if (!markers.pois[p.id]) {
                    markers.pois[p.id] = L.marker([p.lat, p.lon], { icon: L.icon({ iconUrl: poiIcons[p.simbol] || poiIcons.black, iconSize: [18, 28], iconAnchor: [9, 28] }) }).addTo(map).bindTooltip(p.nama, { className: 'poi-label', direction: 'top', offset: [0, -28], permanent: true, opacity: 1 });
                }
            });
        }

        async function calculateRoadDistance(coords) {
            const resDiv = document.getElementById('dist-res');
            if (routeLayer) map.removeLayer(routeLayer);
            if (!coords || !userCoords) return alert("Aktifkan GPS Anda");
            const [poiLat, poiLon] = coords.split(','), [userLat, userLon] = userCoords;
            resDiv.innerText = "Menghitung...";
            try {
                const response = await fetch(`https://router.project-osrm.org/route/v1/driving/${userLon},${userLat};${poiLon},${poiLat}?overview=full&geometries=geojson`);
                const result = await response.json();
                if (result.code === 'Ok') {
                    const data = result.routes[0];
                    const dist = (data.distance / 1000).toFixed(2);
                    const dur = Math.floor((data.duration * 1.5) / 60);
                    resDiv.innerHTML = `Jarak: ${dist} KM<br>Waktu: ±${dur} mnt`;
                    routeLayer = L.geoJSON(data.geometry, { style: { color: '#3498db', weight: 5, opacity: 0.7 } }).addTo(map);
                    map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });
                }
            } catch (err) { resDiv.innerText = "Gagal memuat rute"; }
        }

        function focusUnit(coords) { if (coords) { const c = coords.split(','); map.flyTo([c[0], c[1]], 16); toggleRightMenu(); } }
        function focusLoc(lat, lon) { map.flyTo([lat, lon], 16); togglePOI(); }
        function fitAllUnits() { const all = Object.values(markers.units); if (all.length) map.fitBounds(L.featureGroup(all).getBounds(), {padding:[20,20]}); }
        function openNav() {
            const coords = document.getElementById('select-dest').value;
            if (!coords) return alert("Pilih tujuan!");
            window.open(`https://www.google.com/maps/dir/?api=1&destination=${coords}&travelmode=driving`, '_blank');
        }

        function startAddPOIMode() { isAddMode = true; document.getElementById('poi-btn').style.color = 'red'; togglePOI(); alert("Sentuh peta untuk tambah lokasi"); }

        map.on('click', async (e) => {
            if (!isAddMode) return;
            const nama = prompt("Nama Lokasi:");
            if (nama) {
                await _supabase.from('poi_lokasi').insert([{ nama, lat: e.latlng.lat, lon: e.latlng.lng, simbol: 'black' }]);
                loadPOIs();
            }
            isAddMode = false;
            document.getElementById('poi-btn').style.color = 'white';
        });

        loadPOIs(); fetchUnits();
        setInterval(fetchUnits, 10000);
    </script>
</body>
</html>
