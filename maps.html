<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>IKAEN MAPS</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate.js"></script>
    <script src="https://unpkg.com/leaflet-marker-slide-to@1.2.3/dist/Leaflet.Marker.SlideTo.js"></script>
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; background: #1a1a1a; }
        #map { height: 100vh; width: 100%; z-index: 1; }
        
        /* Menu Samping Kiri */
        .side-menu {
            position: absolute; top: 10px; left: 10px;
            z-index: 1001; display: flex; flex-direction: column; gap: 8px;
        }

        /* Container Menu Kanan */
        .right-menu-container {
            position: absolute; top: 10px; right: 10px;
            z-index: 1001; display: none; flex-direction: column; gap: 10px;
            width: 200px; max-width: 80vw; max-height: 90vh; overflow-y: auto;
            padding-bottom: 10px;
        }

        .layer-menu {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px); padding: 12px;
            border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
            color: white; display: flex; flex-direction: column; gap: 8px;
        }

        .layer-menu select {
            background: #333; color: white; border: 1px solid #444;
            padding: 8px; border-radius: 6px; font-size: 14px; width: 100%;
            outline: none; box-sizing: border-box; -webkit-appearance: none;
        }

        /* Tombol Floating */
        .float-item {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: white; cursor: pointer; transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .nav-btn { width: 48px; height: 48px; font-size: 20px; text-decoration: none; }
        .btn-toggle-menu { background: #3498db; color: white; border: none; }

        /* Popup Unit */
        .unit-popup .leaflet-popup-content-wrapper {
            background: rgba(0, 0, 0, 0.9); color: #fff; border: 1px solid #3498db; border-radius: 8px; font-size: 12px;
        }
        .unit-popup .leaflet-popup-tip { background: #3498db; }

        /* Custom Zoom Control Tengah Atas */
        .leaflet-top.leaflet-center { left: 50%; transform: translateX(-50%); top: 10px; }
        .leaflet-center .leaflet-control { margin: 0; display: flex; flex-direction: row; }
        .leaflet-center .leaflet-control-zoom-in, 
        .leaflet-center .leaflet-control-zoom-out {
            border-radius: 8px !important; margin: 0 5px; background: rgba(0, 0, 0, 0.8) !important;
            color: white !important; border: 1px solid rgba(255,255,255,0.2) !important;
            width: 40px !important; height: 40px !important; line-height: 40px !important;
        }

        /* Desain Ikon Panah Custom Berotasi (Gaya Google Maps) */
        .truck-icon-container {
            transition: transform 0.4s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #3498db;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0px 2px 6px rgba(0,0,0,0.5);
        }
        .truck-icon-container svg {
            width: 16px;
            height: 16px;
            fill: white;
        }
    </style>
</head>
<body>

    <div class="side-menu">
        <button class="float-item nav-btn" onclick="location.reload()"><i class="fa-solid fa-rotate"></i></button>
        <button class="float-item nav-btn btn-toggle-menu" onclick="toggleRightMenu()"><i class="fa-solid fa-bars"></i></button>
    </div>

    <div class="right-menu-container" id="right-menu">
        <div class="layer-menu">
            <div style="font-size: 11px; font-weight: bold; color: #e67e22;"><i class="fa-solid fa-layer-group"></i> TAMPILAN PETA</div>
            <select id="select-layer" onchange="changeLayer(this.value)">
                <option value="osm">Standard (OSM)</option>
                <option value="satelit">Satelit (Hybrid)</option>
                <option value="terrain">Gelap (CartoDB)</option>
            </select>
        </div>
    </div>
        
    <div id="map"></div>

    <script type="module">
        // 1. IMPORT FIREBASE LIBRARIES
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // CONFIG SUPABASE
        const SUPABASE_URL = 'https://ntaECTphgoelmhzrkatp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50YWVjdHBoZ29lbG1oenJrYXRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1NzExNDYsImV4cCI6MjA4ODE0NzE0Nn0.-8E98wpkzHBARRhW6PKhBtf2XKhWFjq7idAzw9jlcKg';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 2. CONFIG FIREBASE FIRESTORE
        const firebaseConfig = {
            apiKey: "AIzaSyBxupBCjk-pcp3KR8tqDrSgDe96SGxQigY",
            authDomain: "ikaen-tracking.firebaseapp.com",
            projectId: "ikaen-tracking",
            storageBucket: "ikaen-tracking.firebasestorage.app",
            messagingSenderId: "390072449388",
            appId: "1:390072449388:web:78b880e0abd8793b69db49"
        };

        const app = initializeApp(firebaseConfig);
        const dbFirestore = getFirestore(app);

        // SETUP MAPS UTAMA
        const savedLat = localStorage.getItem('map_lat') || -2.5489;
        const savedLon = localStorage.getItem('map_lon') || 118.0149;
        const savedZoom = localStorage.getItem('map_zoom') || 5;

        const map = L.map('map', { 
            zoomControl: false, 
            attributionControl: false,
            rotate: true, 
            touchRotate: true, 
            shiftKeyRotate: true,
            bearing: 0 
        }).setView([savedLat, savedLon], savedZoom);

        const centerControl = map._controlCorners;
        centerControl.topcenter = L.DomUtil.create('div', 'leaflet-top leaflet-center', map._controlContainer);
        new L.Control.Zoom({ position: 'topcenter' }).addTo(map);

        const baseLayers = {
            'osm': L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'),
            'satelit': L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}'),
            'terrain': L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png')
        };
        
        baseLayers.osm.addTo(map);

        window.changeLayer = function(type) {
            Object.values(baseLayers).forEach(layer => map.removeLayer(layer));
            if (baseLayers[type]) baseLayers[type].addTo(map);
        }

        map.on('moveend zoomend rotateend', () => {
            const center = map.getCenter();
            localStorage.setItem('map_lat', center.lat);
            localStorage.setItem('map_lon', center.lng);
            localStorage.setItem('map_zoom', map.getZoom());
        });

        let markers = { units: {}, pois: {} };
        let routeLayer = null; 
        let userMarker = null;
        let searchMarker = null;
        let isAddMode = false;
        let userCoords = null;
        let firebaseUnsubscribe = null;

        window.toggleRightMenu = function() {
            const menu = document.getElementById('right-menu');
            menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
        }

        function calculateBearing(lat1, lon1, lat2, lon2) {
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const lat1Rad = lat1 * Math.PI / 180;
            const lat2Rad = lat2 * Math.PI / 180;
            const y = Math.sin(dLon) * Math.cos(lat2Rad);
            const x = Math.cos(lat1Rad) * Math.sin(lat2Rad) - Math.sin(lat1Rad) * Math.cos(lat2Rad) * Math.cos(dLon);
            const brng = Math.atan2(y, x) * 180 / Math.PI;
            return (brng + 360) % 360;
        }

        function handleTrackingDone() {
            if (firebaseUnsubscribe) {
                firebaseUnsubscribe();
                firebaseUnsubscribe = null;
            }

            Object.keys(markers.units).forEach(nopol => {
                map.removeLayer(markers.units[nopol]);
                delete markers.units[nopol];
            });

            document.body.innerHTML = `
                <div style="text-align:center; margin-top:100px; font-family:sans-serif; padding:20px;">
                    <div style="font-size:60px; color:#2ecc71; margin-bottom:20px;">🔒</div>
                    <h2 style="color:#2c3e50;">Link Pelacakan Kedaluwarsa</h2>
                    <p style="color:#7f8c8d; font-size:16px;">Unit armada telah sampai di tujuan dan status pengiriman telah selesai (DONE).</p>
                    <p style="color:#bdc3c7; font-size:12px; margin-top:20px;">Demi keamanan data, pelacakan otomatis dinonaktifkan.</p>
                </div>`;
        }

        // 3. DATA REAL-TIME & KONTROL LEAFLET
        async function initTrackingRealtime() {
            const urlParams = new URLSearchParams(window.location.search);
            const targetId = urlParams.get('id');

            if (!targetId) {
                document.body.innerHTML = `
                    <div style="text-align:center; margin-top:100px; font-family:sans-serif; padding:20px;">
                        <h2 style="color:#e74c3c;">⚠️ Akses Ditolak</h2>
                        <p style="color:#555;">Link tidak valid. Silakan gunakan link resmi dari WhatsApp.</p>
                    </div>`;
                return;
            }

            try {
                const { data: dataUnit, error } = await _supabase
                    .from('data_pengiriman') 
                    .select('*')
                    .eq('id', targetId)
                    .maybeSingle();

                if (error || !dataUnit) {
                    document.body.innerHTML = `
                        <div style="text-align:center; margin-top:100px; font-family:sans-serif; padding:20px;">
                            <h2 style="color:#e74c3c;">Data Tidak Ditemukan</h2>
                            <p style="color:#555;">ID Pengiriman tidak terdaftar di sistem kami.</p>
                        </div>`;
                    return;
                }

                const statusRaw = (dataUnit.status || '').toUpperCase();
                if (statusRaw.includes('DELIVERED') || statusRaw.includes('DONE')) {
                    handleTrackingDone();
                    return;
                }

                const nopolSupabase = dataUnit.nopol || dataUnit.Nopol || dataUnit.unit;

                const q = query(
                    collection(dbFirestore, "tracking_unit"), 
                    where("nopol", "==", nopolSupabase)
                );
                
                firebaseUnsubscribe = onSnapshot(q, async (snapshot) => {
                    const { data: reCheck } = await _supabase.from('data_pengiriman').select('status').eq('id', targetId).maybeSingle();
                    if (reCheck) {
                        const currentStatus = (reCheck.status || '').toUpperCase();
                        if (currentStatus.includes('DELIVERED') || currentStatus.includes('DONE')) {
                            handleTrackingDone();
                            return;
                        }
                    }

                    const activeNopols = [];

                    snapshot.forEach((doc) => {
                        const u = doc.data();
                        const sopir = doc.id; 
                        const nopol = u.nopol || sopir;
                        activeNopols.push(nopol);

                        const lat = parseFloat(u.lat), lon = parseFloat(u.lon);
                        if (isNaN(lat) || isNaN(lon)) return;

                        const popupContent = `
                            <div style="line-height:1.6; color:#fff;">
                                <b style="color:#3498db; font-size:14px;">📍 ${nopol} (ON JOB)</b><br>
                                <b>Sopir:</b> ${sopir}<br>
                                <b>Tujuan:</b> ${u.tujuan || '-'}
                            </div>
                        `;

                        if (markers.units[nopol]) {
                            const currentLatLng = markers.units[nopol].getLatLng();
                            let bearing = u.bearing || 0;
                            if (currentLatLng.lat !== lat || currentLatLng.lng !== lon) {
                                bearing = calculateBearing(currentLatLng.lat, currentLatLng.lng, lat, lon);
                            }

                            // Update HTML Icon konten secara langsung agar rotasi ter-apply selaras saat meluncur (slide)
                            const updatedIcon = L.divIcon({
                                html: `
                                    <div class="truck-icon-container" style="transform: rotate(${bearing}deg);">
                                        <svg viewBox="0 0 24 24">
                                            <path d="M12,2L4.5,20.29L5.21,21L12,18L18.79,21L19.5,20.29L12,2Z"/>
                                        </svg>
                                    </div>
                                `,
                                className: '',
                                iconSize: [32, 32],
                                iconAnchor: [16, 16]
                            });
                            markers.units[nopol].setIcon(updatedIcon);

                            // Jalankan kembali peluncuran koordinat tanpa hambatan DOM internal
                            markers.units[nopol].slideTo([lat, lon], {
                                duration: 3500,
                                keepAtCenter: false
                            });
                            
                            markers.units[nopol].getPopup().setContent(popupContent);
                        } else {
                            const initialIcon = L.divIcon({
                                html: `
                                    <div class="truck-icon-container" style="transform: rotate(${u.bearing || 0}deg);">
                                        <svg viewBox="0 0 24 24">
                                            <path d="M12,2L4.5,20.29L5.21,21L12,18L18.79,21L19.5,20.29L12,2Z"/>
                                        </svg>
                                    </div>
                                `,
                                className: '',
                                iconSize: [32, 32],
                                iconAnchor: [16, 16]
                            });

                            markers.units[nopol] = L.marker([lat, lon], { icon: initialIcon })
                            .addTo(map)
                            .bindPopup(popupContent, { className: 'unit-popup', offset: [0, -12] });

                            map.flyTo([lat, lon], 14);
                        }
                    });

                    Object.keys(markers.units).forEach(nopol => {
                        if (!activeNopols.includes(nopol)) {
                            map.removeLayer(markers.units[nopol]);
                            delete markers.units[nopol];
                        }
                    });

                }, (error) => {
                    console.error("Firebase error tracking: ", error);
                });

            } catch (err) {
                console.error("Sistem Error Pelacakan:", err);
            }
        }

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((pos) => {
                userCoords = [pos.coords.latitude, pos.coords.longitude];
            }, () => { console.log("Izin lokasi awal ditolak."); });
        }

        initTrackingRealtime();
    </script>
</body>
</html>
