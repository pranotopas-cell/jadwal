<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LIVE MAP MOBILE</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Roboto, sans-serif; overflow: hidden; background: #1a1a1a; }
        #map { height: 100vh; width: 100%; z-index: 1; }
        
        /* Menu Samping Kiri */
        .side-menu {
            position: absolute; top: 10px; left: 10px;
            z-index: 1000; display: flex; flex-direction: column; gap: 8px;
        }

        /* Container Menu Kanan (Navigasi & Unit) - Sekarang Hidden by Default di Mobile */
        .right-menu-container {
            position: absolute; top: 10px; right: 10px;
            z-index: 1000; display: none; flex-direction: column; gap: 10px;
            width: 200px; max-width: 80vw;
        }

        .route-menu, .focus-menu {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px); padding: 12px;
            border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
            color: white; display: flex; flex-direction: column; gap: 8px;
        }

        .route-menu select, .focus-menu select {
            background: #333; color: white; border: 1px solid #444;
            padding: 8px; border-radius: 6px; font-size: 14px; width: 100%;
            outline: none; -webkit-appearance: none;
        }

        /* Tombol Floating */
        .float-item {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: white; cursor: pointer; transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .nav-btn { width: 48px; height: 48px; font-size: 20px; }
        .btn-toggle-menu { background: #3498db; color: white; }

        .btn-route {
            background: #2ecc71; color: white; border: none;
            padding: 10px; border-radius: 6px; font-size: 13px;
            font-weight: bold; cursor: pointer;
        }

        /* Panel POI */
        #poi-panel {
            position: absolute; top: 0; left: 60px;
            width: 260px; max-width: 70vw; background: white; border-radius: 12px;
            padding: 15px; display: none; max-height: 70vh; overflow-y: auto;
            box-shadow: 5px 5px 20px rgba(0,0,0,0.5); color: #333;
        }

        .unit-label { 
            background: rgba(0, 0, 0, 0.9) !important; 
            border: 1px solid #2ecc71 !important; 
            border-radius: 6px; padding: 8px; color: #fff !important; 
            font-size: 11px;
        }

        .poi-label {
            background: #fff; border: 1px solid #333; border-radius: 4px;
            padding: 4px 8px; font-size: 11px; color: #1a1a1a; font-weight: 600;
        }

        .active-mode { border: 2px solid #e74c3c; color: #e74c3c; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }

        /* Pindahkan Kontrol Zoom agar tidak tertutup menu */
        .leaflet-control-zoom { margin-top: 260px !important; margin-left: 10px !important; }
    </style>
</head>
<body>

    <div class="side-menu">
        <button class="float-item nav-btn" onclick="location.reload()"><i class="fa-solid fa-rotate"></i></button>
        <button class="float-item nav-btn" onclick="fitAllUnits()"><i class="fa-solid fa-expand"></i></button>
        <button class="float-item nav-btn" onclick="togglePOI()" id="poi-btn"><i class="fa-solid fa-map-location-dot"></i></button>
        <button class="float-item nav-btn" onclick="locateUser()"><i class="fa-solid fa-crosshairs"></i></button>
        <button class="float-item nav-btn btn-toggle-menu" onclick="toggleRightMenu()"><i class="fa-solid fa-bars"></i></button>

        <div id="poi-panel">
            <button style="width:100%; background:#2ecc71; color:white; border:none; padding:12px; border-radius:8px; font-weight:bold; margin-bottom:10px;" onclick="startAddPOIMode()"><i class="fa-solid fa-plus"></i> Tambah Lokasi</button>
            <div id="poi-list"></div>
        </div>
    </div>

    <div class="right-menu-container" id="right-menu">
        <div class="route-menu">
            <div style="font-size: 11px; font-weight: bold; color: #2ecc71;"><i class="fa-solid fa-route"></i> NAVIGASI RUTE</div>
            <select id="select-dest">
                <option value="">Pilih Tujuan...</option>
            </select>
            <button class="btn-route" onclick="openNav()"><i class="fa-solid fa-location-arrow"></i> Mulai Jalan</button>
        </div>

        <div class="focus-menu">
            <div style="font-size: 11px; font-weight: bold; color: #3498db;"><i class="fa-solid fa-truck"></i> FOKUS UNIT</div>
            <select id="select-unit" onchange="focusUnit(this.value)">
                <option value="">Cari Unit...</option>
            </select>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const SUPABASE_URL = 'https://ntaECTphgoelmhzrkatp.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50YWVjdHBoZ29lbG1oenJrYXRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1NzExNDYsImV4cCI6MjA4ODE0NzE0Nn0.-8E98wpkzHBARRhW6PKhBtf2XKhWFjq7idAzw9jlcKg';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const map = L.map('map', { zoomControl: true, attributionControl: false }).setView([-2.5489, 118.0149], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let markers = { units: {}, pois: {} };
        let userMarker = null;
        let isAddMode = false;

        const poiIcons = {
            black: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-black.png',
            blue: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
            red: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            gold: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-gold.png'
        };

        // Fungsi Baru untuk Mobile Toggle
        function toggleRightMenu() {
            const menu = document.getElementById('right-menu');
            menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
        }

        function togglePOI() {
            const p = document.getElementById('poi-panel');
            p.style.display = p.style.display === 'block' ? 'none' : 'block';
        }

        function locateUser() {
            if (!navigator.geolocation) return alert("GPS tidak didukung");
            navigator.geolocation.getCurrentPosition((pos) => {
                const lat = pos.coords.latitude, lon = pos.coords.longitude;
                if (userMarker) userMarker.setLatLng([lat, lon]);
                else {
                    userMarker = L.marker([lat, lon], { icon: L.icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-violet.png', iconSize: [25, 41], iconAnchor: [12, 41] }) }).addTo(map);
                }
                map.flyTo([lat, lon], 15);
            }, () => alert("Aktifkan GPS HP Anda"));
        }

        async function fetchUnits() {
            const { data, error } = await _supabase.from('tracking_unit').select('*').eq('status', 'ON_JOB');
            if (error) return;
            const selectUnit = document.getElementById('select-unit');
            selectUnit.innerHTML = '<option value="">Cari Unit...</option>';
            data?.forEach(u => {
                const lat = parseFloat(u.lat), lon = parseFloat(u.lon);
                const opt = document.createElement('option');
                opt.value = `${lat},${lon}`;
                opt.textContent = `${u.nopol} - ${u.sopir}`;
                selectUnit.appendChild(opt);

                if (markers.units[u.nopol]) {
                    markers.units[u.nopol].setLatLng([lat, lon]);
                } else {
                    markers.units[u.nopol] = L.marker([lat, lon], { icon: L.icon({ iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png', iconSize: [25, 41], iconAnchor: [12, 41] }) })
                    .addTo(map).bindTooltip(u.nopol, { className: 'unit-label', direction: 'top', offset: [0, -35] });
                }
            });
        }

        async function loadPOIs() {
            const { data, error } = await _supabase.from('poi_lokasi').select('*');
            if (error) return;
            const list = document.getElementById('poi-list');
            const select = document.getElementById('select-dest');
            list.innerHTML = ""; select.innerHTML = '<option value="">Pilih Tujuan...</option>';
            
            data?.forEach(p => {
                const div = document.createElement('div');
                div.style = "padding:12px; border-bottom:1px solid #eee; display:flex; justify-content:space-between;";
                div.innerHTML = `<span onclick="focusLoc(${p.lat}, ${p.lon})" style="flex:1">📍 ${p.nama}</span><i class="fa-solid fa-trash" style="color:red" onclick="deletePOI(${p.id})"></i>`;
                list.appendChild(div);

                const opt = document.createElement('option');
                opt.value = `${p.lat},${p.lon}`; opt.textContent = p.nama;
                select.appendChild(opt);

                if (!markers.pois[p.id]) {
                    markers.pois[p.id] = L.marker([p.lat, p.lon], { icon: L.icon({ iconUrl: poiIcons[p.simbol] || poiIcons.black, iconSize: [20, 32], iconAnchor: [10, 32] }) })
                    .addTo(map).bindTooltip(p.nama, { className: 'poi-label', direction: 'top', offset: [0, -30] });
                }
            });
        }

        function focusUnit(coords) { if (coords) { const c = coords.split(','); map.flyTo([c[0], c[1]], 16); toggleRightMenu(); } }
        function focusLoc(lat, lon) { map.flyTo([lat, lon], 16); togglePOI(); }
        function fitAllUnits() { const all = Object.values(markers.units); if (all.length) map.fitBounds(L.featureGroup(all).getBounds(), {padding:[20,20]}); }
        
        function openNav() {
            const coords = document.getElementById('select-dest').value;
            if (!coords) return alert("Pilih tujuan!");
            window.open(`https://www.google.com/maps/dir/?api=1&destination=${coords}&travelmode=driving`, '_blank');
        }

        function startAddPOIMode() {
            isAddMode = true;
            document.getElementById('poi-btn').classList.add('active-mode');
            togglePOI();
            alert("Sentuh titik di peta untuk lokasi baru");
        }

        map.on('click', async (e) => {
            if (!isAddMode) return;
            const nama = prompt("Nama Lokasi:");
            if (nama) {
                await _supabase.from('poi_lokasi').insert([{ nama, lat: e.latlng.lat, lon: e.latlng.lng, simbol: 'black' }]);
                loadPOIs();
            }
            isAddMode = false;
            document.getElementById('poi-btn').classList.remove('active-mode');
        });

        async function deletePOI(id) {
            if (confirm("Hapus?")) {
                await _supabase.from('poi_lokasi').delete().eq('id', id);
                map.removeLayer(markers.pois[id]);
                delete markers.pois[id];
                loadPOIs();
            }
        }

        loadPOIs(); fetchUnits();
        setInterval(fetchUnits, 10000);
        _supabase.channel('any').on('postgres_changes', {event:'*', schema:'public', table:'tracking_unit'}, fetchUnits).subscribe();
    </script>
</body>
</html>
