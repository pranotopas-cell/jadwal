<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REAL-TIME MONITORING LOGISTIK</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { height: 100vh; width: 100%; }
        .info-box {
            position: absolute; top: 15px; left: 55px; z-index: 1000;
            background: white; padding: 12px; border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border-left: 5px solid #2ecc71;
        }
        .status-dot { height: 10px; width: 10px; background-color: #2ecc71; border-radius: 50%; display: inline-block; animation: blink 1s infinite; margin-right: 5px; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } }
        h3 { margin: 0; font-size: 16px; color: #333; }
        
        .admin-marker-label {
            font-weight: bold;
            color: #e74c3c;
        }
    </style>
</head>
<body>

    <div class="info-box">
        <h3>LOGISTICS MONITORING</h3>
        <div style="font-size: 12px; color: #666; margin-top: 5px;">
            <span class="status-dot"></span> System Live: Terhubung ke Supabase
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- KONFIGURASI SUPABASE ---
        const SB_URL = "https://qnamtickoteyvydayyor.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFuYW10aWNrb3RleXZ5ZGF5eW9yIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4OTU2MzksImV4cCI6MjA5MzQ3MTYzOX0.VAeN0JVnz4WNPzY5NTGmtGeHD-Da_qkCvy84ZDYZNHo";
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        // Inisialisasi Peta
        var map = L.map('map').setView([-6.2146, 106.8451], 12); 

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        var markers = {}; 
        var adminMarker = null;

        // --- FUNGSI LOKASI ADMIN (MENGGUNAKAN WATCH POSITION) ---
        // Menggunakan watchPosition agar izin hanya diminta 1x di awal
        function startWatchingAdmin() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition((position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;

                    // Ikon Merah untuk membedakan Admin dengan Unit
                    const adminIcon = L.icon({
                        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
                        shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                        iconSize: [25, 41],
                        iconAnchor: [12, 41],
                        popupAnchor: [1, -34],
                        shadowSize: [41, 41]
                    });

                    if (adminMarker) {
                        adminMarker.setLatLng([lat, lon]);
                    } else {
                        adminMarker = L.marker([lat, lon], {icon: adminIcon})
                            .addTo(map)
                            .bindPopup("<b class='admin-marker-label'>Posisi Saya (Admin)</b>")
                            .openPopup();
                        
                        // Fokus ke posisi admin saat pertama kali ditemukan
                        map.setView([lat, lon], 13);
                    }
                }, (err) => {
                    console.warn("Akses lokasi bermasalah:", err.message);
                }, {
                    enableHighAccuracy: true,
                    maximumAge: 10000,
                    timeout: 5000
                });
            } else {
                alert("Browser Anda tidak mendukung akses lokasi.");
            }
        }

        // --- FUNGSI UPDATE TRACKING UNIT DARI SUPABASE ---
        async function updateTracking() {
            const { data, error } = await _supabase
                .from('tracking_unit')
                .select('*')
                .eq('status', 'ON_JOB'); 

            if (error) {
                console.error("Gagal ambil data Supabase:", error);
                return;
            }

            if (data && data.length > 0) {
                data.forEach(unit => {
                    const lat = parseFloat(unit.lat);
                    const lon = parseFloat(unit.lon);
                    
                    if (!isNaN(lat) && !isNaN(lon)) {
                        if (markers[unit.nopol]) {
                            markers[unit.nopol].setLatLng([lat, lon]);
                        } else {
                            markers[unit.nopol] = L.marker([lat, lon])
                                .addTo(map)
                                .bindPopup(`
                                    <div style="font-family: sans-serif;">
                                        <b style="font-size:14px;">UNIT: ${unit.nopol}</b><br>
                                        <span style="color:#666;">Driver: ${unit.sopir || '-'}</span><br>
                                        <small>Update: ${new Date(unit.last_update).toLocaleTimeString()}</small>
                                    </div>
                                `);
                        }
                    }
                });
            }
        }

        // Jalankan monitoring
        startWatchingAdmin(); // Pantau posisi admin secara real-time
        setInterval(updateTracking, 5000); // Cek update armada setiap 5 detik
        updateTracking(); // Jalankan sekali saat awal
    </script>
</body>
</html>
