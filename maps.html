        }

        function getWIBDateString() {
            const d = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Jakarta" }));
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        function playAirportChime() {
            return new Promise((resolve) => {
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (!AudioContext) {
                        resolve();
                        return;
                    }
                    const ctx = new AudioContext();

                    const notes = [
                        { freq: 698.46, time: 0.00, duration: 0.45 },
                        { freq: 587.33, time: 0.35, duration: 0.45 },
                        { freq: 440.00, time: 0.70, duration: 0.45 },
                        { freq: 349.23, time: 1.05, duration: 1.10 }
                    ];

                    notes.forEach(note => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();

                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(note.freq, ctx.currentTime + note.time);

                        gain.gain.setValueAtTime(0.0001, ctx.currentTime + note.time);
                        gain.gain.exponentialRampToValueAtTime(0.4, ctx.currentTime + note.time + 0.03);
                        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + note.time + note.duration);

                        osc.connect(gain);
                        gain.connect(ctx.destination);

                        osc.start(ctx.currentTime + note.time);
                        osc.stop(ctx.currentTime + note.time + note.duration);
                    });

                    setTimeout(() => {
                        ctx.close();
                        resolve();
                    }, 2200);
                } catch (e) {
                    console.error("Gagal memutar chime:", e);
                    resolve();
                }
            });
        }

        async function playVoiceAnnouncement(text) {
            if (!isAudioAllowed) return;

            const originalVolume = audio.volume;
            if (!audio.paused) audio.volume = 0.1;

            await playAirportChime();

            const safetyMessage = "jaga kualitas dan kuantitas pengiriman bbm, serta utamakan keselamatan dan selalu gunakan alat pelindung diri saat bertugas. Terima kasih.";
            const fullText = text + safetyMessage;

            const finishAnnouncement = async () => {
                await playAirportChime();
                if (!audio.paused) audio.volume = originalVolume;
            };

            const speakFallback = () => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const msg = new SpeechSynthesisUtterance(fullText);
                    msg.lang = 'id-ID';
                    msg.rate = 0.75;
                    msg.onend = finishAnnouncement;
                    msg.onerror = finishAnnouncement;
                    window.speechSynthesis.speak(msg);
                } else {
                    finishAnnouncement();
                }
            };

            if (window.responsiveVoice && typeof responsiveVoice.speak === 'function') {
                try {
                    responsiveVoice.speak(fullText, "Indonesian Female", {
                        pitch: 1,
                        rate: 0.75,
                        volume: 1,
                        onend: finishAnnouncement,
                        onerror: speakFallback
                    });
                } catch (e) {
                    speakFallback();
                }
            } else {
                speakFallback();
            }
        }

        function enableAudioSystem() {
            isAudioAllowed = true;
            document.getElementById('audioInitModal').style.display = 'none';
            playVoiceAnnouncement("Sistem suara telah aktif.");
        }

        function toggleAudio() {
            const btn = document.getElementById('playPauseBtn');
            const statusLabel = document.getElementById('audio-status');
            if (audio.paused) { playCurrentSource(); } 
            else { audio.pause(); btn.innerText = "▶"; statusLabel.innerText = "STOP"; }
        }

        function playCurrentSource() {
            const btn = document.getElementById('playPauseBtn');
            const statusLabel = document.getElementById('audio-status');
            statusLabel.innerText = "CONNECTING...";
            audio.src = streamSources[currentSourceIndex];
            audio.play().then(() => {
                btn.innerText = "⏸";
                statusLabel.innerText = "QUR'AN LIVE";
            }).catch(() => tryNextSource());
        }

        function tryNextSource() {
            currentSourceIndex = (currentSourceIndex + 1) % streamSources.length;
            playCurrentSource();
        }

        function wrapText(element) {
            const text = element.textContent;
            element.innerHTML = '';
            const words = text.split(' ');
            words.forEach((word) => {
                if (!word) return;
                const wordSpan = document.createElement('span');
                wordSpan.className = 'word-wrapper';
                word.split('').forEach(char => {
                    const wrapper = document.createElement('span');
                    wrapper.className = 'letter-wrapper';
                    const s = document.createElement('span');
                    s.className = 'letter';
                    s.innerHTML = char;
                    wrapper.appendChild(s);
                    wordSpan.appendChild(wrapper);
                });
                element.appendChild(wordSpan);
            });
        }

        async function animateIn(overlay) {
            overlay.style.display = 'flex';
            overlay.offsetHeight;
            overlay.style.opacity = '1';
            const letters = overlay.querySelectorAll('.letter');
            for (let i = 0; i < letters.length; i++) {
                letters[i].classList.remove('out');
                letters[i].classList.add('in');
                if (i % 3 === 0) await new Promise(r => setTimeout(r, 15));
            }
        }

        async function animateOut(overlay) {
            const letters = overlay.querySelectorAll('.letter');
            for (let i = 0; i < letters.length; i++) {
                letters[i].classList.remove('in');
                letters[i].classList.add('out');
                if (i % 4 === 0) await new Promise(r => setTimeout(r, 10));
            }
            overlay.style.opacity = '0';
            await new Promise(r => setTimeout(r, 800));
            overlay.style.display = 'none';
        }

        async function showQuote() {
            const overlay = document.getElementById('quoteOverlay');
            const qTxt = document.getElementById('quoteText');
            const qSrc = document.getElementById('quoteSource');
            
            const q = quotes[quoteIndex];
            quoteIndex = (quoteIndex + 1) % quotes.length;

            qTxt.textContent = q.t;
            qSrc.textContent = q.s;
            
            wrapText(qTxt);
            wrapText(qSrc);
            
            await animateIn(overlay);
            await new Promise(r => setTimeout(r, 30000)); 
            await animateOut(overlay);
        }

        const scrollContainer = document.getElementById('scrollContainer');
        
        function stopAutoScroll() {
            if (scrollRequest) {
                cancelAnimationFrame(scrollRequest);
                scrollRequest = null;
            }
            isScrolling = false;
        }

        function startAutoScroll() {
            stopAutoScroll();

            if (scrollContainer.scrollHeight <= scrollContainer.clientHeight) {
                setTimeout(async () => {
                    await showQuote();
                    loadDashboard();
                }, 10000);
                return;
            }

            isScrolling = true;
            const scrollSpeed = 0.25; 

            function step() {
                if (!isScrolling) return;

                const currentPos = scrollContainer.scrollTop + scrollContainer.clientHeight + 2;
                const maxPos = scrollContainer.scrollHeight;

                if (currentPos >= maxPos) {
                    stopAutoScroll();
                    setTimeout(async () => {
                        await showQuote(); 
                        scrollContainer.scrollTo({ top: 0, behavior: 'smooth' });
                        setTimeout(() => { 
                            loadDashboard(); 
                        }, 500); 
                    }, 1000);
                    return; 
                }

                scrollContainer.scrollTop += scrollSpeed;
                scrollRequest = requestAnimationFrame(step);
            }

            setTimeout(() => { 
                if (isScrolling) {
                    scrollRequest = requestAnimationFrame(step); 
                }
            }, 3000); 
        }

        function getWIB() { return new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Jakarta" })); }

        // FUNGSI PENGUMUMAN SUARA (JAM SAJA SAAT DELIVERED)
        function announceStatusChange(item, statusType) {

                teks = `Mohon perhatian, armada dengan nomor polisi ${nopolEja}. pengemudi ${sopir}, tujuan pengiriman ${tujuan}, status DELIVERED telah sampai lokasi pengiriman pada pukul ${jamSekarang}.`;
            }

            if (teks) {
                playVoiceAnnouncement(teks);
            }
        }

            try {
                const hariIni = getWIB();
                const isoHariIni = getWIBDateString();
                document.getElementById('targetDate').innerText = hariIni.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).toUpperCase();

                const { data, error } = await _supabase.from('data_pengiriman').select('*').gte('tanggal', isoHariIni);
                if (error) throw error;
                
                const currentData = data || [];

                currentData.forEach(item => {
                    const id = item.id || (item.sopir + '_' + item.tanggal + '_' + item.delivery_to);
                    const statusBaru = (item.status || "").toUpperCase();
                    const isHariIni = (item.tanggal === isoHariIni);

                    if (!isInitialLoad && isHariIni) {
                        const statusLama = previousStatusMap[id];
                        
                        if (statusBaru.includes("PROSES") && statusLama && !statusLama.includes("PROSES")) {
                            announceStatusChange(item, "PROSES");
                        }
                        else if (statusBaru.includes("DELIVERED") && statusLama && !statusLama.includes("DELIVERED")) {
                            announceStatusChange(item, "DELIVERED");
                        }
                    }
                    previousStatusMap[id] = statusBaru;
                });

                isInitialLoad = false;
                renderData(currentData);
            } catch (err) { 
                console.error("Gagal:", err.message); 
                startAutoScroll();
            }
        }

        function setupRealtimeListener() {
            _supabase
                .channel('realtime_pengiriman')
                .on(
                    'postgres_changes',
                    { event: '*', schema: 'public', table: 'data_pengiriman' },
                    (payload) => {
                        if (payload.eventType === 'UPDATE' || payload.eventType === 'INSERT') {
                            const item = payload.new;
                            const isoHariIni = getWIBDateString();
                            const id = item.id || (item.sopir + '_' + item.tanggal + '_' + item.delivery_to);
                            const statusBaru = (item.status || "").toUpperCase();
                            const statusLama = previousStatusMap[id];

                            if (item.tanggal === isoHariIni) {
                                if (statusBaru.includes("PROSES") && statusLama && !statusLama.includes("PROSES")) {
                                    announceStatusChange(item, "PROSES");
                                } else if (statusBaru.includes("DELIVERED") && statusLama && !statusLama.includes("DELIVERED")) {
                                    announceStatusChange(item, "DELIVERED");
                                }
                            }
                            previousStatusMap[id] = statusBaru;
                        }
                        loadDashboard();
                    }
                )
                .subscribe();
        }

        // FUNGSI RENDER TABEL (PEMBATAS HARI/TANGGAL DIHILANGKAN & DELIVERED DITAMPILKAN DENGAN JAM)
        async function renderData(data) {
            stopAutoScroll();

            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            const priority = { "PROSES": 1, "LANGSIR": 2, "TERJADWAL": 3, "OPER": 4, "NGISI ": 5, "TUNGGU": 6, "DELIVERED": 7 };

            data.sort((a, b) => {
                if(a.tanggal !== b.tanggal) return a.tanggal.localeCompare(b.tanggal);
                return (priority[a.status?.toUpperCase()] || 99) - (priority[b.status?.toUpperCase()] || 99);
            });

            for (let row of data) {
                const tr = document.createElement('tr');
                const st = (row.status || "").toUpperCase();
                
                let cls = "st-terjadwal";
                if (st.includes("PROSES")) cls = "st-proses";
                else if (st.includes("LANGSIR")) cls = "st-langsir";
                else if (st.includes("OPER")) cls = "st-oper";
                else if (st.includes("TUNGGU")) cls = "st-tunggu";
                else if (st.includes("NGISI")) cls = "st-ngisi";
                else if (st.includes("DELIVERED")) cls = "st-delivered";

                // Format teks status (jika DELIVERED tambahkan jam)
                let statusDisplay = st;
                if (st.includes("DELIVERED")) {
                    const jamSelesai = row.updated_at 
                        ? new Date(row.updated_at).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Jakarta' })
                        : getWIB().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                    statusDisplay = `DELIVERED (${jamSelesai})`;
                }

                tr.innerHTML = `
                    <td>
                        <div class="flight-cell">
                            <div class="nopol-block">${row.nopol || '-'}</div>
                            <div class="sopir-name">${row.sopir || '-'}</div>
                        </div>
                        <div style="font-size:15px; color:var(--text-blue-soft); margin-left:2px;">LOCATION : ${row.lokasi || '-'}</div>
                    </td>
                    <td style="text-align:center; font-weight:bold; color:var(--text-gold-soft); font-size:18px;">${row.jumlah_keluar || '0'}</td>
                    <td>
                        <div style="color:var(--text-white-soft); font-weight:bold; font-size:16px; margin-bottom:4px;">${row.delivery_to || '-'}</div>
                        <div style="color:var(--text-blue-soft); font-size:14px; font-weight:600; text-transform:uppercase;">DEPO : ${row.supplier || '-'}</div>
                    </td>
                    <td class="${cls}" style="text-align:right; font-size:16px; font-weight:bold; letter-spacing:1px;">${statusDisplay}</td>
                `;
                tbody.appendChild(tr);
            }

            scrollContainer.scrollTop = 0;
            startAutoScroll();
        }

        setInterval(() => {
            const now = getWIB();
            document.getElementById('clock').innerText = now.toTimeString().split(' ')[0];
        }, 1000);

        loadDashboard();
        setupRealtimeListener();
    </script>
</body>
</html>
